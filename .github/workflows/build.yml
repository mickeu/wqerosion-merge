name: build-merged-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i '^Xcode' || true
          XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -i 'Xcode_26' | head -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Schemes
        run: xcodebuild -list -project Erosion.xcodeproj || true

      - name: Build (unsigned)
        run: |
          set -e
          xcodebuild \
            -project Erosion.xcodeproj \
            -target Erosion \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            ASSETCATALOG_COMPILER_APPICON_NAME="AppIcon" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          test -n "$APP"
          rm -rf out && mkdir -p out/Payload
          cp -r "$APP" out/Payload/
          ( cd out && zip -qry ../Erosion-merged.ipa Payload )
          ls -la Erosion-merged.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-merged-ipa
          path: Erosion-merged.ipa
